services:
  - type: web
    name: jakebot-api
    runtime: python
    pythonVersion: "3.9"  # Especifique uma versão
    buildCommand: |
      pip install -r requirements.txt
      flake8 --ignore=E501,W503 .
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: "production"