title: Brasil Participativo - Análise de Sentimentos
email: contato@example.com
description: >-
  Projeto desenvolvido na disciplina de Métodos de Desenvolvimento de Software (MDS) da Universidade de Brasília - FGA.
  Este blog apresenta o progresso, os aprendizados e os resultados da ferramenta de análise de sentimentos aplicada à plataforma Brasil Participativo.

baseurl: "/2025_1-Jakebot" # não altere isso, é o nome do repositório
url: "https://unb-mds.github.io" # se o GitHub Pages for da organização do grupo

twitter_username: ""
github_username: unb-mds

# Build settings
theme: minima
plugins:
  - jekyll-feed


